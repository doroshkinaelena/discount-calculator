<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il Tuo Sconto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .inner-soft-shadow {
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.55), inset 0 -8px 20px rgba(15, 23, 42, 0.08);
      }
      .floating-icon {
        position: absolute;
        color: rgba(255, 255, 255, 0.22);
        filter: blur(2px);
        pointer-events: none;
        user-select: none;
      }
      .glass-toast-enter {
        animation: slideDown 0.25s ease-out;
      }
      @keyframes slideDown {
        0% { opacity: 0; transform: translateY(-12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="relative min-h-screen overflow-hidden bg-gradient-to-br from-cyan-300 via-blue-400 to-indigo-500 px-4 py-8 sm:py-10">
    <div aria-hidden="true" class="absolute inset-0 z-0">
      <!-- Shopping cart -->
      <svg class="floating-icon top-10 left-8 h-24 w-24 sm:h-28 sm:w-28" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4">
        <circle cx="9" cy="20" r="1.5"></circle>
        <circle cx="17" cy="20" r="1.5"></circle>
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.76L20 7H7"></path>
      </svg>
      <!-- Tag -->
      <svg class="floating-icon top-20 right-10 h-20 w-20 sm:h-24 sm:w-24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8L10.6 3H18a2 2 0 0 1 2 2v7.4a2 2 0 0 1-.6 1.4z"></path>
        <circle cx="15.5" cy="8.5" r="1.2"></circle>
      </svg>
      <!-- Percent -->
      <svg class="floating-icon top-1/2 left-6 h-24 w-24 sm:h-32 sm:w-32 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4">
        <line x1="19" y1="5" x2="5" y2="19" stroke-linecap="round"></line>
        <circle cx="7.5" cy="7.5" r="2.3"></circle>
        <circle cx="16.5" cy="16.5" r="2.3"></circle>
      </svg>
      <!-- Gift -->
      <svg class="floating-icon bottom-10 right-8 h-24 w-24 sm:h-32 sm:w-32" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4">
        <rect x="3.5" y="10" width="17" height="10" rx="1.8"></rect>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v10M3.5 14.5h17M12 10H7.8a2.3 2.3 0 1 1 0-4.6c2.3 0 4.2 4.6 4.2 4.6zM12 10h4.2a2.3 2.3 0 1 0 0-4.6C13.9 5.4 12 10 12 10z"></path>
      </svg>
      <!-- Extra tag -->
      <svg class="floating-icon bottom-24 left-16 h-16 w-16 sm:h-20 sm:w-20" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 3H5a2 2 0 0 0-2 2v6l9.5 9.5a2.1 2.1 0 0 0 3 0l5-5a2.1 2.1 0 0 0 0-3L11 3z"></path>
        <circle cx="7.4" cy="7.4" r="1.1"></circle>
      </svg>
    </div>

    <div id="toastContainer" class="fixed top-6 left-1/2 -translate-x-1/2 z-50"></div>

    <main class="relative z-10 mx-auto w-full max-w-xl">
      <section class="backdrop-blur-xl bg-white/20 border border-white/30 rounded-3xl shadow-[0_20px_80px_rgba(30,64,175,0.28)] p-6 sm:p-8">
        <nav class="flex items-center justify-between mb-7">
          <h1 id="title" class="text-2xl sm:text-3xl font-semibold text-slate-900 tracking-tight">Il Tuo Sconto</h1>
          <div class="text-sm font-semibold text-slate-800 bg-white/35 rounded-xl px-2 py-1 border border-white/40">
            <button data-lang="it" class="langBtn px-2 py-1 rounded-md bg-white/70">IT</button>
            <span class="opacity-60">|</span>
            <button data-lang="en" class="langBtn px-2 py-1 rounded-md">EN</button>
            <span class="opacity-60">|</span>
            <button data-lang="ru" class="langBtn px-2 py-1 rounded-md">RU</button>
          </div>
        </nav>

        <div class="space-y-4">
          <div>
            <label id="modeLabel" for="modeSelect" class="block text-slate-800 font-semibold mb-2"></label>
            <select id="modeSelect" class="w-full bg-white/40 border-none rounded-2xl p-4 text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-white/50 inner-soft-shadow">
              <option value="price_by_percent"></option>
              <option value="discount_percent"></option>
              <option value="price_by_fixed"></option>
            </select>
          </div>

          <div>
            <label id="primaryLabel" for="primaryInput" class="block text-slate-800 font-semibold mb-2"></label>
            <input id="primaryInput" type="text" inputmode="decimal" class="w-full bg-white/40 border-none rounded-2xl p-4 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-white/50 inner-soft-shadow" />
          </div>

          <div>
            <label id="secondaryLabel" for="secondaryInput" class="block text-slate-800 font-semibold mb-2"></label>
            <input id="secondaryInput" type="text" inputmode="decimal" class="w-full bg-white/40 border-none rounded-2xl p-4 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-white/50 inner-soft-shadow" />
          </div>

          <div>
            <label id="currencyLabel" for="currencySelect" class="block text-slate-800 font-semibold mb-2"></label>
            <select id="currencySelect" class="w-full bg-white/40 border-none rounded-2xl p-4 text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-white/50 inner-soft-shadow">
              <option value="€">EUR (€)</option>
              <option value="$">USD ($)</option>
              <option value="₽">RUB (₽)</option>
              <option value="other"></option>
            </select>
          </div>

          <div id="customCurrencyWrap" class="hidden overflow-hidden transition-all duration-300 max-h-0 opacity-0">
            <label id="customCurrencyLabel" for="customCurrencyInput" class="block text-slate-800 font-semibold mb-2"></label>
            <input id="customCurrencyInput" type="text" maxlength="4" class="w-full bg-white/40 border-none rounded-2xl p-4 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-white/50 inner-soft-shadow" />
          </div>
        </div>

        <button id="calculateBtn" class="mt-6 w-full bg-white text-blue-600 font-bold rounded-2xl py-4 shadow-lg shadow-blue-500/20 hover:scale-[1.02] transition-all">
          Calculate
        </button>

        <div class="mt-5 bg-white/30 border border-white/40 rounded-2xl p-4">
          <p id="statusText" class="text-sm font-semibold text-slate-700"></p>
          <p id="resultText" class="text-3xl font-bold text-slate-900 mt-1">0.00 €</p>
        </div>

        <div class="mt-6 flex items-center justify-between">
          <button id="infoBtn" class="p-3 rounded-xl bg-white/45 hover:bg-white/65 transition border border-white/40 text-slate-700" aria-label="Info">
            <!-- Lucide-style: info -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"></circle>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4"></path>
              <circle cx="12" cy="8.4" r="0.8" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <button id="resetBtn" class="p-3 rounded-xl bg-white/45 hover:bg-white/65 transition border border-white/40 text-slate-700" aria-label="Reset">
            <!-- Lucide-style: trash-2 -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 6V4h8v2"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 6l-1 14H6L5 6"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6M14 11v6"></path>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div id="infoModal" class="hidden fixed inset-0 bg-slate-900/25 backdrop-blur-sm z-40 items-center justify-center p-4">
      <div class="w-full max-w-md backdrop-blur-xl bg-white/30 border border-white/45 rounded-3xl p-6">
        <h2 id="infoTitle" class="text-xl font-semibold text-slate-900 mb-2"></h2>
        <p id="infoBody" class="text-slate-800"></p>
        <button id="closeInfoBtn" class="mt-4 px-4 py-2 rounded-xl bg-white/70 text-slate-800 font-semibold hover:bg-white transition">OK</button>
      </div>
    </div>

    <script>
      const i18n = {
        it: {
          title: "Il Tuo Sconto",
          modeLabel: "Modalita di calcolo",
          modes: {
            price_by_percent: "Calcola prezzo scontato",
            discount_percent: "Calcola la % di sconto applicata",
            price_by_fixed: "Prezzo meno importo sconto"
          },
          labels: {
            price: "Prezzo",
            discountedPrice: "Prezzo scontato",
            discountPercent: "Sconto (%)",
            discountAmount: "Importo sconto",
            currency: "Valuta",
            otherCurrency: "Valuta personalizzata"
          },
          placeholders: {
            price: "0.00",
            discountedPrice: "0.00",
            discountPercent: "0",
            discountAmount: "0.00",
            customCurrency: "SYM"
          },
          btn: { calculate: "Calcola" },
          status: { success: "Calcolato correttamente" },
          errors: {
            required: "Compila tutti i campi richiesti",
            invalidNumber: "Usa solo numeri, punto o virgola",
            discountRange: "Lo sconto deve essere tra 0 e 100",
            customCurrency: "Inserisci un simbolo valuta personalizzato"
          },
          info: {
            title: "Informazioni",
            body: "Tre modalita: calcolo % sconto, prezzo meno sconto percentuale, prezzo meno importo fisso."
          },
          currencyOther: "Altro"
        },
        en: {
          title: "Your Discount",
          modeLabel: "Calculation mode",
          modes: {
            price_by_percent: "Calculate discounted price",
            discount_percent: "Find the applied % discount",
            price_by_fixed: "Price minus cash discount"
          },
          labels: {
            price: "Price",
            discountedPrice: "Discounted price",
            discountPercent: "Discount (%)",
            discountAmount: "Discount amount",
            currency: "Currency",
            otherCurrency: "Custom currency"
          },
          placeholders: {
            price: "0.00",
            discountedPrice: "0.00",
            discountPercent: "0",
            discountAmount: "0.00",
            customCurrency: "SYM"
          },
          btn: { calculate: "Calculate" },
          status: { success: "Calculated correctly" },
          errors: {
            required: "Please fill all required fields",
            invalidNumber: "Use numbers only with dot or comma",
            discountRange: "Discount must be between 0 and 100",
            customCurrency: "Please enter a custom currency symbol"
          },
          info: {
            title: "Info",
            body: "Three modes: calculate discount percent, price minus percent discount, and price minus fixed amount."
          },
          currencyOther: "Other"
        },
        ru: {
          title: "Твоя Скидка",
          modeLabel: "Режим расчета",
          modes: {
            price_by_percent: "Рассчитать цену со скидкой (%)",
            discount_percent: "Узнать какой это % скидки",
            price_by_fixed: "Цена минус сумма скидки (в валюте)"
          },
          labels: {
            price: "Цена",
            discountedPrice: "Цена со скидкой",
            discountPercent: "Скидка (%)",
            discountAmount: "Сумма скидки",
            currency: "Валюта",
            otherCurrency: "Своя валюта"
          },
          placeholders: {
            price: "0.00",
            discountedPrice: "0.00",
            discountPercent: "0",
            discountAmount: "0.00",
            customCurrency: "СИМВ"
          },
          btn: { calculate: "Рассчитать" },
          status: { success: "Рассчитано корректно" },
          errors: {
            required: "Заполните все обязательные поля",
            invalidNumber: "Используйте только цифры, точку или запятую",
            discountRange: "Скидка должна быть в диапазоне от 0 до 100",
            customCurrency: "Введите символ своей валюты"
          },
          info: {
            title: "Информация",
            body: "Три режима: расчет процента скидки, цена минус процент, и цена минус фиксированная сумма."
          },
          currencyOther: "Другое"
        }
      };

      const els = {
        title: document.getElementById("title"),
        modeLabel: document.getElementById("modeLabel"),
        modeSelect: document.getElementById("modeSelect"),
        primaryLabel: document.getElementById("primaryLabel"),
        secondaryLabel: document.getElementById("secondaryLabel"),
        primaryInput: document.getElementById("primaryInput"),
        secondaryInput: document.getElementById("secondaryInput"),
        currencyLabel: document.getElementById("currencyLabel"),
        currencySelect: document.getElementById("currencySelect"),
        customCurrencyWrap: document.getElementById("customCurrencyWrap"),
        customCurrencyLabel: document.getElementById("customCurrencyLabel"),
        customCurrencyInput: document.getElementById("customCurrencyInput"),
        calculateBtn: document.getElementById("calculateBtn"),
        statusText: document.getElementById("statusText"),
        resultText: document.getElementById("resultText"),
        toastContainer: document.getElementById("toastContainer"),
        langBtns: document.querySelectorAll(".langBtn"),
        infoBtn: document.getElementById("infoBtn"),
        resetBtn: document.getElementById("resetBtn"),
        infoModal: document.getElementById("infoModal"),
        infoTitle: document.getElementById("infoTitle"),
        infoBody: document.getElementById("infoBody"),
        closeInfoBtn: document.getElementById("closeInfoBtn")
      };

      let currentLang = "it";

      function parseNumber(value) {
        return Number.parseFloat(value.replace(",", "."));
      }

      function sanitizeNumericInput(input) {
        let clean = input.value.replace(/[^0-9.,]/g, "");
        const firstSeparatorIndex = clean.search(/[.,]/);

        // Keep only the very first decimal separator (dot or comma), remove all subsequent ones.
        if (firstSeparatorIndex !== -1) {
          clean =
            clean.slice(0, firstSeparatorIndex + 1) +
            clean.slice(firstSeparatorIndex + 1).replace(/[.,]/g, "");
        }

        // If input starts with separator, normalize to leading zero (".5" => "0.5", ",5" => "0,5").
        if (/^[.,]/.test(clean)) {
          clean = `0${clean}`;
        }

        input.value = clean;
      }

      function getCurrencySymbol() {
        if (els.currencySelect.value !== "other") return els.currencySelect.value;
        return els.customCurrencyInput.value.trim();
      }

      function showToast(message) {
        els.toastContainer.innerHTML = "";
        const toast = document.createElement("div");
        toast.className = "glass-toast-enter backdrop-blur-xl bg-red-300/25 border border-red-200/45 text-red-900 font-semibold px-5 py-3 rounded-2xl shadow-[0_14px_40px_rgba(127,29,29,0.25)]";
        toast.textContent = message;
        els.toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      function applyLanguage() {
        const t = i18n[currentLang];
        els.title.textContent = t.title;
        els.modeLabel.textContent = t.modeLabel;
        els.currencyLabel.textContent = t.labels.currency;
        els.customCurrencyLabel.textContent = t.labels.otherCurrency;
        els.customCurrencyInput.placeholder = t.placeholders.customCurrency;
        els.calculateBtn.textContent = t.btn.calculate;
        els.infoTitle.textContent = t.info.title;
        els.infoBody.textContent = t.info.body;

        els.modeSelect.options[0].textContent = t.modes.price_by_percent;
        els.modeSelect.options[1].textContent = t.modes.discount_percent;
        els.modeSelect.options[2].textContent = t.modes.price_by_fixed;
        els.currencySelect.options[3].textContent = t.currencyOther;

        const mode = els.modeSelect.value;
        if (mode === "discount_percent") {
          els.primaryLabel.textContent = t.labels.price;
          els.secondaryLabel.textContent = t.labels.discountedPrice;
          els.primaryInput.placeholder = t.placeholders.price;
          els.secondaryInput.placeholder = t.placeholders.discountedPrice;
        } else if (mode === "price_by_percent") {
          els.primaryLabel.textContent = t.labels.price;
          els.secondaryLabel.textContent = t.labels.discountPercent;
          els.primaryInput.placeholder = t.placeholders.price;
          els.secondaryInput.placeholder = t.placeholders.discountPercent;
        } else {
          els.primaryLabel.textContent = t.labels.price;
          els.secondaryLabel.textContent = t.labels.discountAmount;
          els.primaryInput.placeholder = t.placeholders.price;
          els.secondaryInput.placeholder = t.placeholders.discountAmount;
        }

        els.langBtns.forEach((btn) => {
          if (btn.dataset.lang === currentLang) {
            btn.classList.add("bg-white/70");
          } else {
            btn.classList.remove("bg-white/70");
          }
        });
      }

      function syncModeUI() {
        applyLanguage();
      }

      function toggleCustomCurrencyInput() {
        const show = els.currencySelect.value === "other";
        if (show) {
          els.customCurrencyWrap.classList.remove("hidden");
          requestAnimationFrame(() => {
            els.customCurrencyWrap.classList.remove("max-h-0", "opacity-0");
            els.customCurrencyWrap.classList.add("max-h-40", "opacity-100");
          });
        } else {
          els.customCurrencyWrap.classList.remove("max-h-40", "opacity-100");
          els.customCurrencyWrap.classList.add("max-h-0", "opacity-0");
          setTimeout(() => els.customCurrencyWrap.classList.add("hidden"), 260);
        }
      }

      function calculate() {
        const t = i18n[currentLang];
        const mode = els.modeSelect.value;
        const currency = getCurrencySymbol();
        if (els.currencySelect.value === "other" && !currency) {
          showToast(t.errors.customCurrency);
          return;
        }

        const a = parseNumber(els.primaryInput.value);
        const b = parseNumber(els.secondaryInput.value);

        if (!els.primaryInput.value.trim() || !els.secondaryInput.value.trim() || Number.isNaN(a) || Number.isNaN(b)) {
          showToast(t.errors.required);
          return;
        }

        let result;
        if (mode === "discount_percent") {
          if (a <= 0) {
            showToast(t.errors.required);
            return;
          }
          result = ((a - b) / a) * 100;
          if (result > 100 || result < 0) {
            showToast(t.errors.discountRange);
            return;
          }
          els.resultText.textContent = `${result.toFixed(2)}%`;
        } else if (mode === "price_by_percent") {
          if (b > 100) {
            showToast(t.errors.discountRange);
            return;
          }
          result = a * (1 - b / 100);
          els.resultText.textContent = `${result.toFixed(2)} ${currency}`;
        } else {
          result = a - b;
          els.resultText.textContent = `${result.toFixed(2)} ${currency}`;
        }

        els.statusText.textContent = t.status.success;
      }

      function resetAll() {
        els.primaryInput.value = "";
        els.secondaryInput.value = "";
        els.customCurrencyInput.value = "";
        els.currencySelect.value = "€";
        toggleCustomCurrencyInput();
        els.statusText.textContent = "";
        els.resultText.textContent = "0.00 €";
      }

      els.langBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          currentLang = btn.dataset.lang;
          applyLanguage();
        });
      });

      els.modeSelect.addEventListener("change", syncModeUI);
      els.currencySelect.addEventListener("change", toggleCustomCurrencyInput);
      els.calculateBtn.addEventListener("click", calculate);
      els.resetBtn.addEventListener("click", resetAll);

      els.infoBtn.addEventListener("click", () => {
        els.infoModal.classList.remove("hidden");
        els.infoModal.classList.add("flex");
      });
      els.closeInfoBtn.addEventListener("click", () => {
        els.infoModal.classList.remove("flex");
        els.infoModal.classList.add("hidden");
      });
      els.infoModal.addEventListener("click", (e) => {
        if (e.target === els.infoModal) {
          els.infoModal.classList.remove("flex");
          els.infoModal.classList.add("hidden");
        }
      });

      [els.primaryInput, els.secondaryInput].forEach((input) => {
        input.addEventListener("input", () => sanitizeNumericInput(input));
      });
      els.customCurrencyInput.addEventListener("input", () => {
        els.customCurrencyInput.value = els.customCurrencyInput.value.replace(/\s/g, "");
      });

      applyLanguage();
    </script>
  </body>
</html>
